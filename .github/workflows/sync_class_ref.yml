name: Synchronize EGP reference
on:
  workflow_dispatch:
    inputs:
      engine_revision:
        description: EGP engine commit to document
        required: true
        default: master
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZSG-Studios/EGP
          ref: ${{ inputs.engine_revision }}
          path: .engine-src
          sparse-checkout: |
            doc
            modules
            platform
            misc
            demos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_egp_docs.py --engine .engine-src
      - name: Export reviewable patch
        run: git diff --binary > egp-docs-update.patch
      - uses: actions/upload-artifact@v4
        with:
          name: egp-docs-update
          path: egp-docs-update.patch
