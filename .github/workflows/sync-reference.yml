name: Sync reference
# Regenerates the class reference and guides from an EGP-Engine commit and uploads the
# result as a reviewable patch. Manual only.
on:
  workflow_dispatch:
    inputs:
      engine_revision:
        description: EGP-Engine commit or branch to document
        required: true
        default: master

permissions:
  contents: read

jobs:
  sync:
    name: Generate reference patch
    runs-on: [self-hosted, egp-linux]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout engine sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZSG-Studios/EGP-Engine
          ref: ${{ inputs.engine_revision }}
          path: .engine-src
          sparse-checkout: |
            doc
            modules
            platform
            misc
            demos

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Regenerate reference and guides
        run: python tools/sync_egp_docs.py --engine .engine-src

      - name: Export reviewable patch
        run: git diff --binary > egp-docs-update.patch

      - name: Upload patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egp-docs-update
          path: egp-docs-update.patch
          retention-days: 14
