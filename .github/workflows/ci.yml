name: CI
# Builds the manual and class reference on EGP self-hosted runners. This repository is
# public, so only pushes and manual runs trigger it: untrusted code never runs on the hosts.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build manual and reference
    runs-on: [self-hosted, egp-linux]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Read pinned engine revision
        id: engine
        run: python -c 'import json, os; print("revision=" + json.load(open("egp/source_manifest.json"))["engine_revision"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'

      - name: Checkout pinned engine sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZSG-Studios/EGP-Engine
          ref: ${{ steps.engine.outputs.revision }}
          path: .engine-src
          sparse-checkout: |
            doc
            modules
            platform
            misc
            demos

      - name: Verify generated reference and guide freshness
        run: python tools/sync_egp_docs.py --engine .engine-src --check

      - name: Check public declaration extraction
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Build HTML
        run: python -m sphinx -b html -W --keep-going -j 4 . _build/html

      - name: Upload HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egp-docs-html
          path: _build/html
          retention-days: 14
