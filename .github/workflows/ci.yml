name: EGP documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: egp-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Read pinned engine revision
        id: engine
        run: python -c 'import json, os; print("revision=" + json.load(open("egp/source_manifest.json"))["engine_revision"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/checkout@v4
        with:
          repository: ZSG-Studios/EGP
          ref: ${{ steps.engine.outputs.revision }}
          path: .engine-src
          sparse-checkout: |
            doc
            modules
            platform
            misc
      - name: Verify generated reference and guide freshness
        run: python tools/sync_egp_docs.py --engine .engine-src --check
      - name: Check public declaration extraction
        run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m pip install -r requirements.txt
      - name: Build complete manual and reference
        run: python -m sphinx -b html -W --keep-going -j 4 . _build/html
      - uses: actions/upload-artifact@v4
        with:
          name: egp-docs-html
          path: _build/html
